<!doctype html>
<html lang="en">

  <style>
    body {
      background: #f4f6f8;
      line-height: 2rem;
      font-weight: 400;
      margin: 0;
    }

    .PreLoading {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: -1;
    }

    @keyframes spinner-loading {
      100% {
        transform: rotate(1turn);
      }
    }

    .PreLoading .PreLoading-Loader {
      height: 1.5rem;
      width: 1.5rem;
      animation: spinner-loading 0.5s linear infinite;
      color: transparent;
    }

    .PreLoading p {
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, San Francisco, Roboto,
      Segoe UI, Helvetica Neue, sans-serif;
      font-size: 1rem;
      color: #424242;
    }
  </style>
</head>
